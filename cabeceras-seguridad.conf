# Cabeceras de seguridad del SPA en producción (auditoría M11, 07/11/2026).
# Se incluye en cada bloque de nginx.conf que tenga su propio add_header: en nginx, un add_header
# dentro de un location anula los del nivel server, así que sin el include se perderían ahí.
#
# Qué ordena cada una al navegador:
#   Content-Security-Policy   lista de lo único que la página puede cargar y a dónde puede conectarse.
#                             Un script inyectado no podría enviar el token a otro sitio.
#   X-Frame-Options / frame-ancestors   ninguna otra página puede mostrar SGE-JD dentro de un marco.
#   X-Content-Type-Options    el navegador no "adivina" el tipo de un archivo.
#   Referrer-Policy           la dirección (que al volver del login lleva ?code=) no se envía a otros sitios.
#
# Si se cambia el dominio (servidor de JD): reemplazar http://localhost:48088 (backend) y
# http://localhost:48080 (Keycloak) en connect-src, igual que en src/environments/environment.prod.ts.
#
# Los 'sha256-...' de script-src son las huellas de los dos scripts en línea del index.html compilado:
#   1) el del tema oscuro (src/index.html);
#   2) el que agrega Angular al compilar para cargar styles.css sin bloquear la página.
# Si alguno cambia, el navegador lo bloquea (la página quedaría sin estilos o sin tema). Por eso el
# build de producción es `npm run build:prod`: compila y compara estas huellas (scripts/verificar-csp.mjs).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YNxe83QqzedqhVbzsRlctuSgT71qK5TskVWIFh+JTig=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:48088 http://localhost:48080; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
