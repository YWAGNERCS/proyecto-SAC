# ============================================================
# Perfil prod (S13): lo usa el contenedor de compose-prod.yml (SPRING_PROFILES_ACTIVE=prod).
# Ningún dato de conexión ni secreto va escrito aquí: todo llega por variable de entorno y,
# sin valor por defecto, si falta una el backend NO arranca (falla con un mensaje claro en vez
# de arrancar con una contraseña de ejemplo). No se importa application-local.properties.
# ============================================================

# --- Oracle de prod (contenedor sge-jd-oracle-prod) ---
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El backend nunca cambia el esquema en prod: lo crea scripts/prod/esquema_jdrefrigeracion.sql
# y Hibernate solo comprueba que coincida con las entidades (si falta algo, no arranca).
spring.jpa.hibernate.ddl-auto=validate
# BD2 S8: el backend puede entrar como JD_APP (sin tablas propias, solo roles sobre las del dueño). Hibernate y el
# SQL directo (JdbcTemplate) deben apuntar al esquema dueño. Con DB_USERNAME=jdrefrigeracion no cambia nada.
# OJO: no pasar estas dos como variables de entorno con "_" (Spring las convierte en "." y no las reconoce):
# por eso van escritas aquí, con el esquema por variable.
spring.jpa.properties.hibernate.default_schema=${DB_ESQUEMA:JDREFRIGERACION}
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA = ${DB_ESQUEMA:JDREFRIGERACION}

# --- Keycloak de prod ---
# El token lo pide el navegador a http://localhost:48080, así que su "iss" es esa URL; pero
# dentro del contenedor "localhost" es el propio backend. Por eso: el emisor se valida con la
# URL pública y las claves (JWKS) y la API de administración se piden por la red interna.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL_INTERNA}/protocol/openid-connect/certs
app.keycloak.url-interna=${KEYCLOAK_URL_INTERNA}
app.keycloak.admin.client-secret=${KC_BACKEND_SECRET}

# --- CORS: el build de producción del frontend se sirve en 4300 ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4300}

# --- Documentación de la API: apagada, no solo protegida (SecurityConfig la deja abierta) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Actuator: lo mínimo. /actuator/env, /heapdump, /metrics... ni siquiera existen (404) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
