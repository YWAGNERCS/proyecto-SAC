<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Documentación - JD Refrigeración</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentación Oficial">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema base: Vue (similar al de Material) -->
  <!-- Tema Premium: Docsify Themeable (Simple Theme) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <!-- Fuentes de Google: Inter (cuerpo) y Lora (encabezados elegantes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* 
      Estética "Old Money" / Editorial de Lujo
      Paleta: Marfil (Ivory), Azul Marino Profundo (Navy), Oro Mudo (Muted Gold).
    */
    :root {
      /* Tipografía global */
      --base-font-family: 'Inter', sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.7;
      --base-color: #2D3136;
      
      /* Fondos */
      --base-background-color: #FBF9F6;
      
      /* Encabezados */
      --heading-color: #17202A;
      --heading-h1-font-family: 'Lora', serif;
      --heading-h2-font-family: 'Lora', serif;
      --heading-h3-font-family: 'Lora', serif;
      --heading-h4-font-family: 'Lora', serif;
      --heading-h1-font-weight: 600;
      --heading-h2-font-weight: 500;
      --heading-h1-border-color: #C5A059;
      --heading-h1-border-width: 1px;
      
      /* Barra Lateral (Sidebar - Deep Navy) */
      --sidebar-background: #17202A;
      --sidebar-border-width: 0;
      --sidebar-name-color: #C5A059;
      --sidebar-name-font-family: 'Lora', serif;
      --sidebar-name-font-weight: 600;
      
      /* (Se eliminaron las variables del sidebar-toggle para evitar conflicto de doble borde) */
      
      /* Tablas */
      --table-body-border-color: #E2DDD5;
      --table-body-border-width: 1px;
      --table-cell-padding: 12px 16px;
      --table-head-background: #F2EFE9;
      --table-head-font-weight: 600;
      --table-head-font-family: 'Lora', serif;
      --table-head-color: #17202A;
      --table-row-background--hover: #F2EFE9;
      
      /* Blockquotes */
      --blockquote-border-color: #C5A059;
      --blockquote-border-width: 3px;
      --blockquote-background: #F2EFE9;
      --blockquote-color: #4A4A4A;
      
      /* Enlaces */
      --link-color: #8A6D3B;
      --link-text-decoration--hover: underline;
    }

    /* =========================================
       AJUSTES DE BURBUJAS (CORRECCIÓN)
       ========================================= */
       
    /* Enlaces estilo "Burbuja" (Pills) */
    .sidebar ul li a {
      color: #8C98A4 !important;
      font-weight: 400;
      font-size: 13.5px !important;
      border-radius: 20px !important;  
      margin: 4px 8px !important;
      padding: 6px 12px !important;
      white-space: normal !important;
      line-height: 1.4 !important;
      transition: all 0.2s ease !important;
      border: none !important;
    }
    .sidebar ul li a:hover, .sidebar ul li.active > a {
      color: #C5A059 !important;
      font-weight: 500 !important;
      background-color: rgba(197, 160, 89, 0.12) !important;
    }

    /* Corrección definitiva del botón "3 rayas": Solo rayas flotantes */
    .sidebar-toggle {
      background-color: transparent !important; /* Sin fondo */
      border: none !important; /* Sin círculo */
      box-shadow: none !important; /* Sin sombra */
      width: 44px !important;
      height: 44px !important;
      padding: 0 !important;
      position: absolute !important;
      bottom: 20px !important;
      left: 20px !important;
    }
    
    /* Centrado matemático absoluto para anular cualquier regla oculta de docsify */
    .sidebar-toggle-button {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      width: 20px !important;
      height: 14px !important; /* 3 rayas de 2px + 2 espacios de 4px = 14px */
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      margin: 0 !important;
      display: block !important;
    }
    
    .sidebar-toggle span {
      background-color: #C5A059 !important; /* Rayas doradas */
      width: 100% !important;
      height: 2px !important;
      margin-bottom: 4px !important;
      border-radius: 2px !important;
      display: block !important;
    }
    .sidebar-toggle span:last-child {
      margin-bottom: 0 !important;
    }

    /* Ajustes finos */
    .markdown-section table {
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #E2DDD5;
      background-color: #ffffff;
    }
    .markdown-section table th {
      text-transform: capitalize;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .markdown-section blockquote {
      border-radius: 0 4px 4px 0;
      padding: 18px 24px;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.05rem;
    }
    .sidebar>h1 {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      letter-spacing: 0.03em;
    }
    .markdown-section h1 {
      font-size: 2.4rem;
      letter-spacing: -0.01em;
      margin-bottom: 35px;
    }
    .markdown-section h2 {
      font-size: 1.7rem;
      border-bottom: 1px dashed #E2DDD5;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Documentación...</div>
  <script>
    window.$docsify = {
      name: 'JD Refrigeración',
      repo: '',
      loadSidebar: false,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      search: {
        placeholder: 'Buscar...',
        noData: 'No se encontraron resultados!',
        depth: 4
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Búsqueda -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Docsify Themeable (Core) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
