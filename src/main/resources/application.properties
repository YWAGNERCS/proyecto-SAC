# ============================================================
# Configuración común a todos los perfiles (S13).
#   dev  (por defecto): application-dev.properties  → mvn spring-boot:run, Oracle 1522, Keycloak 38080
#   prod: application-prod.properties → contenedor Docker (compose-prod.yml), todo por variables de entorno
# Secretos y datos locales: NUNCA van en este archivo.
# ============================================================
spring.profiles.default=dev

# ==========================================================
# Perfil de PRUEBAS: base de datos H2 en memoria
# Uso esto mientras desarrollas, para no depender de Oracle
# instalado en tu maquina. Los datos se borran al reiniciar.
# ==========================================================
# spring.datasource.url=jdbc:h2:mem:jdrefrigeracion
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ddl-auto lo decide cada perfil: update en dev, validate en prod (el esquema lo crea el script de BD).
# Como la guía (S1): la conexión no queda abierta hasta escribir el JSON. Las relaciones LAZY se leen
# dentro de la transacción del servicio, que es donde se arma el DTO.
spring.jpa.open-in-view=false
# Auditoría M9 (07/11/2026): las relaciones LAZY (detalle, cliente, producto...) se cargan de a 100 con un
# IN (...) en vez de una consulta por fila. La lista completa de ventas pasó de 380 consultas a unas pocas.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# show-sql escribe directo en la consola y se salta logback: el SQL se ve con el logger
# org.hibernate.SQL en DEBUG, que solo enciende el perfil dev (logback-spring.xml).
spring.jpa.show-sql=false

server.port=8080

# ==========================================================
# Base de datos Oracle (BD2)
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USERNAME:jdrefrigeracion}
spring.datasource.password=${DB_PASSWORD:}
# Hibernate 7 detecta OracleDialect solo (indicarlo da un aviso de obsoleto).

# ==========================================================
# APIS EXTERNAS
# ==========================================================
# Consulta de RUC/DNI: apis.net.pe v1 (sin token) y, como respaldo, Decolecta (con token)
decolecta.token=${DECOLECTA_TOKEN:}
# true = datos de prueba sin internet (no consulta ninguna API)
app.consulta-documentos.simulado=${CONSULTA_DOCUMENTOS_SIMULADO:false}

# ==========================================================
# CONFIGURACIÓN DE CORREO (Gmail SMTP)
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Datos de JD Refrigeración S.A.C. (comprobantes y proformas en PDF) ---
# Teléfono y correo de la empresa: pendientes de confirmar con Lisandro.
# Spring lee este archivo en ISO-8859-1: las tildes de los valores van escapadas (\u00XX).
app.empresa.razon-social=JD REFRIGERACI\u00d3N S.A.C.
app.empresa.ruc=20521632268
app.empresa.direccion=Jr. Jorge Ch\u00e1vez N\u00b0 184 / 206, Urb. Chacra Colorada, Bre\u00f1a, Lima
# Cuenta de detracciones de JD en el Banco de la Naci\u00f3n: va impresa en las facturas con detracci\u00f3n.
# Pendiente de confirmar con Lisandro (vac\u00eda: la factura dice "cuenta por confirmar").
app.empresa.cuenta-detracciones=${CUENTA_DETRACCIONES:}
# Contacto oficial que se muestra en el correo del comprobante. Vac\u00edos: no se muestran (no se inventan).
app.empresa.telefono=${EMPRESA_TELEFONO:}
app.empresa.correo-contacto=${EMPRESA_CORREO:}
app.empresa.web=${EMPRESA_WEB:}

# --- Entrega del comprobante por correo (PDF + XML firmado) ---
# Intentos autom\u00e1ticos por env\u00edo (con esperas de 2, 10, 30 y 120 minutos entre ellos).
app.correo.max-intentos=5
# Cada cu\u00e1nto se revisan los correos pendientes o fallidos (tambi\u00e9n recupera los que quedaron al reiniciar).
app.correo.revision-ms=60000
app.correo.revision-inicial-ms=30000
# Un env\u00edo "en proceso" por m\u00e1s de estos minutos se interrumpi\u00f3 (p. ej. se apag\u00f3 el backend): queda INCIERTO.
app.correo.minutos-en-proceso=10
# Conciliaci\u00f3n: comprobantes aceptados en producci\u00f3n en estos \u00faltimos d\u00edas sin env\u00edo autom\u00e1tico (evento perdido).
app.correo.conciliar-dias=3

# --- Descuento máximo por línea (%) en proformas y ventas, según el rol ---
# Propuesta inicial: confirmar los topes con Lisandro.
app.descuentos.tope-admin=30
app.descuentos.tope-asistente=10

# --- Detracci\u00f3n (SPOT) y retenci\u00f3n del IGV (ver DeduccionTributariaService) ---
# Servicios de mantenimiento y reparaci\u00f3n: 12 %. Agentes de retenci\u00f3n: 3 %. Ambas desde S/ 700 (IGV incluido).
# Confirmar los porcentajes con el contador de JD.
app.tributos.detraccion-porcentaje=12
app.tributos.retencion-porcentaje=3
app.tributos.umbral-soles=700

# --- CORS (separar origenes con coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Correo de la oficina que recibe las alertas automaticas ---
app.notificaciones.correo-oficina=${CORREO_OFICINA:}

# --- Timeouts SMTP (evita que un envio fallido deje colgada la peticion) ---
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Seguridad (S10b): tokens emitidos por Keycloak, realm "bomerp" ---
# Spring descarga /.well-known/openid-configuration del emisor, toma de ahí las claves públicas (JWKS)
# y rechaza todo token cuya firma no sea de Keycloak o cuyo "iss" no coincida con esta URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:38080/realms/bomerp}

# Permisos delegables e historial de sesiones: el backend consulta la API de administración de Keycloak
# con su propia cuenta de servicio (cliente confidencial sgejd-backend, lo crea keycloak/configurar_realm.py).
# El secreto va en .env (KC_BACKEND_SECRET) o en application-local.properties, nunca aquí.
app.keycloak.admin.client-id=sgejd-backend
app.keycloak.admin.client-secret=${KC_BACKEND_SECRET:}

# --- Facturación electrónica ---
# simulado (por defecto): no envía nada. sunat: envío directo a SUNAT con el usuario SOL y el
# certificado de JD (SEE - Del Contribuyente). La URL decide el ambiente:
#   beta (pruebas, sin efecto tributario): https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
#   producción: https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService
app.facturacion.modo=${FACTURACION_MODO:simulado}
# Series de SGE-JD (4 caracteres; facturas y sus notas con F, boletas y sus notas con B). Si JD ya usa
# alguna desde el portal de SUNAT u otro sistema, poner otra: un número no puede repetirse.
app.facturacion.series.factura=${SERIE_FACTURA:F001}
app.facturacion.series.boleta=${SERIE_BOLETA:B001}
app.facturacion.series.nota-factura=${SERIE_NOTA_FACTURA:FC01}
app.facturacion.series.nota-boleta=${SERIE_NOTA_BOLETA:BC01}
app.sunat.url=${SUNAT_URL:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
app.sunat.usuario=${SUNAT_USUARIO:MODDATOS}
app.sunat.clave=${SUNAT_CLAVE:MODDATOS}
app.sunat.certificado-ruta=${SUNAT_CERT_RUTA:certificados/beta-prueba.p12}
app.sunat.certificado-clave=${SUNAT_CERT_CLAVE:}

# --- Actuator (S13) ---
# El correo es opcional (sin cuenta configurada no se envía): no debe marcar la salud como DOWN.
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.nombre=SGE-JD
info.app.empresa=JD Refrigeración S.A.C.
