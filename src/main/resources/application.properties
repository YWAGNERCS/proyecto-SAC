# ============================================================
# Secretos y datos locales: NUNCA van en este archivo.
# Se leen de variables de entorno o de application-local.properties
# (ignorado por git; ver application-local.properties.example).
# ============================================================
spring.config.import=optional:classpath:application-local.properties

# ==========================================================
# Perfil de PRUEBAS: base de datos H2 en memoria
# Uso esto mientras desarrollas, para no depender de Oracle
# instalado en tu maquina. Los datos se borran al reiniciar.
# ==========================================================
# spring.datasource.url=jdbc:h2:mem:jdrefrigeracion
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ==========================================================
# Base de datos Oracle (BD2)
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME:jdrefrigeracion}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ==========================================================
# APIS EXTERNAS
# ==========================================================
# Consulta de RUC/DNI: apis.net.pe v1 (sin token) y, como respaldo, Decolecta (con token)
decolecta.token=${DECOLECTA_TOKEN:}
# true = datos de prueba sin internet (no consulta ninguna API)
app.consulta-documentos.simulado=${CONSULTA_DOCUMENTOS_SIMULADO:false}

# ==========================================================
# CONFIGURACIÓN DE CORREO (Gmail SMTP)
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS (separar origenes con coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Correo de la oficina que recibe las alertas automaticas ---
app.notificaciones.correo-oficina=${CORREO_OFICINA:}

# --- Timeouts SMTP (evita que un envio fallido deje colgada la peticion) ---
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Login del panel admin (/api/v1/admin/**) ---
# TEMPORAL: false porque el frontend aun no tiene pantalla de login. En cuanto exista, poner true.
app.security.admin-requiere-login=false
