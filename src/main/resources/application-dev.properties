# ============================================================
# Perfil dev (S13): el de siempre, activo por defecto (mvn spring-boot:run).
# Secretos locales en application-local.properties (ignorado por git; ver .example)
# o en variables de entorno.
# ============================================================
spring.config.import=optional:classpath:application-local.properties

# El esquema se ajusta solo a las entidades (en prod no: validate).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Actuator: todo expuesto para medir (metrics, env, loggers...). Igual exige token de ADMIN
# (SecurityConfig): solo /actuator/health y /actuator/info son abiertos.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
