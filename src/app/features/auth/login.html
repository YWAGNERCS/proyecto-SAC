<div class="login-page">
  <!-- Fondo animado -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-card">
    <!-- Logo / Marca -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#grad)"/>
          <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="white" opacity="0.9"/>
          <path d="M20 14 L26 20 L20 26 L14 20 Z" fill="white" opacity="0.4"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">BomERP</span>
        <span class="brand-sub">Panel Administrativo</span>
      </div>
    </div>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-desc">Ingresa tus credenciales para continuar</p>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate autocomplete="on">

      <!-- Error global -->
      @if (error()) {
        <div class="alert-error" role="alert">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          {{ error() }}
        </div>
      }

      <!-- Usuario -->
      <div class="field-group">
        <label for="username" class="field-label">Usuario</label>
        <div class="field-input-wrapper">
          <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v1h16v-1c0-2.21-3.58-4-8-4z"/>
          </svg>
          <input
            id="username"
            name="username"
            type="text"
            class="field-input"
            placeholder="administrador"
            autocomplete="username"
            [(ngModel)]="username"
            required
            [disabled]="cargando()"
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="field-group">
        <label for="password" class="field-label">Contraseña</label>
        <div class="field-input-wrapper">
          <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <input
            id="password"
            name="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            class="field-input"
            placeholder="••••••••"
            autocomplete="current-password"
            [(ngModel)]="password"
            required
            [disabled]="cargando()"
          />
          <button
            type="button"
            class="toggle-pwd"
            (click)="togglePassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarPassword()) {
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path d="M10 3C5 3 1.73 7.11 1.2 10c.53 2.89 3.8 7 8.8 7s8.27-4.11 8.8-7C18.27 7.11 15 3 10 3zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
              </svg>
            } @else {
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z"/>
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Botón submit -->
      <button
        id="btn-login"
        type="submit"
        class="btn-login"
        [class.loading]="cargando()"
        [disabled]="cargando() || !username || !password"
      >
        @if (cargando()) {
          <span class="spinner"></span>
          Ingresando...
        } @else {
          Ingresar al panel
        }
      </button>
    </form>

    <p class="login-footer">JD Refrigeración S.A.C. &mdash; Sistema de Gestión Empresarial</p>
  </div>
</div>
