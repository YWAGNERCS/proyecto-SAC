<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SGE-JD · JD Refrigeración</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Producción: la CSP de nginx permite este script por su huella (cabeceras-seguridad.conf).
       Si se cambia una sola letra de su contenido, `npm run build:prod` avisa la huella nueva. -->
  <script>
    // Tema antes de que cargue Angular, para no ver un destello claro al abrir en modo oscuro
    // (misma regla que PreferenciasService; si falla, Angular lo aplica igual al iniciar)
    try {
      var tema = (JSON.parse(localStorage.getItem('sgejd.preferencias') || '{}').tema) || 'SISTEMA';
      var oscuro = tema === 'OSCURO' || (tema === 'SISTEMA' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = oscuro ? 'oscuro' : 'claro';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
