# Sirve el build de producción del SPA (S13). Angular resuelve las rutas en el navegador:
# /ventas no existe como archivo, así que toda ruta desconocida devuelve index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx (en la cabecera Server ni en las páginas de error)
    server_tokens off;

    # Cabeceras de seguridad (auditoría M11): en cada bloque que tiene su propio add_header
    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea (así cada despliegue se ve al recargar); los .js y .css
    # llevan un hash en el nombre (outputHashing: all), pueden cachearse un año sin riesgo.
    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
